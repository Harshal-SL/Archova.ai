artifact: hld
title: High Level Design Architecture Rubric
sources: ["ISO42010", "ISO25010", "ATAM"]
applicable_tags: ["multi-az", "availability", "topology", "resilience", "concurrency", "security"]

dimensions:
  - id: requirement_coverage
    label: Requirement Coverage
    weight: 0.20
    description: All functional requirements mapped to designated components with explicit ownership.
    source: ISO42010

  - id: component_boundaries
    label: Component Boundaries & Decoupling
    weight: 0.12
    description: High cohesion, loose coupling, clear single-responsibility service boundaries.
    source: ISO42010

  - id: data_ownership
    label: Data Ownership & Storage Strategy
    weight: 0.10
    description: Explicit data store per service or clean polyglot persistence without shared-database anti-patterns.
    source: ISO42010

  - id: communication_fit
    label: Communication Pattern Fit
    weight: 0.08
    description: Appropriate synchronous (gRPC/REST) vs asynchronous (Kafka/RabbitMQ event streams) protocols.
    source: ATAM

  - id: nfr_mechanisms
    label: Non-Functional Requirement Mechanisms
    weight: 0.15
    description: Specific architectural mechanisms addressing latency, throughput, and scalability targets.
    source: ISO25010

  - id: security_boundaries
    label: Security Boundaries & Network Segmentation
    weight: 0.10
    description: Trust boundaries, ingress filtering, and inter-service authentication defined.
    source: ISO25010

  - id: resilience
    label: Resilience & Fault Isolation
    weight: 0.10
    description: Circuit breakers, rate limits, graceful degradation, and elimination of single points of failure.
    source: ISO25010

  - id: specificity
    label: Concrete Specificity & Requirement Binding
    weight: 0.15
    description: 5 = named entities, concrete numbers and mechanisms tied to requirement IDs; 0-2 = generic statements without entity or requirement link.
    source: internal
