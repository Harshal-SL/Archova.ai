artifact: hld
title: High Level Design Architecture Rubric
sources: ["ISO42010", "ISO25010", "ATAM"]
applicable_tags: ["multi-az", "availability", "topology", "resilience", "concurrency", "security"]

dimensions:
  - id: requirement_coverage
    label: Requirement Coverage & Component Boundaries
    weight: 0.30
    description: Functional requirements mapped to decoupled components with explicit single-responsibility boundaries.
    source: ISO42010

  - id: data_and_resilience
    label: Data Ownership, Protocols & Resilience
    weight: 0.25
    description: Explicit polyglot persistence, appropriate sync/async communication protocols, and fault isolation mechanisms.
    source: ATAM

  - id: nfr_and_security
    label: NFR Mechanisms & Security Boundaries
    weight: 0.25
    description: Specific architectural mechanisms addressing latency, throughput, scalability targets, and network trust boundaries.
    source: ISO25010

  - id: specificity
    label: Concrete Specificity & Requirement Binding
    weight: 0.20
    description: 5 = named entities, concrete numbers and mechanisms tied to requirement IDs; 0-2 = generic statements without entity or requirement link.
    source: internal
