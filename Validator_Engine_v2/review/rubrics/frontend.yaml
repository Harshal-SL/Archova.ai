dimensions:
  - id: view_route_coverage
    label: View & Route Coverage vs User Workflows
    weight: 0.30
    description: User personas, workflows, and pages mapped to designated client routes and component trees.
    source: IEEE1016

  - id: api_binding_and_state
    label: API Binding Validity & State Synchronization
    weight: 0.25
    description: Client HTTP integration matching backend API contracts, and predictable state store / cache invalidation.
    source: IEEE1016

  - id: error_loading_and_auth
    label: Error/Loading States & Route Protection
    weight: 0.25
    description: Graceful error boundaries, skeleton loaders, protected route wrappers, and token refresh mechanisms.
    source: ISO25010

  - id: specificity
    label: Concrete Specificity & Requirement Binding
    weight: 0.20
    description: 5 = named entities, concrete numbers and mechanisms tied to requirement IDs; 0-2 = generic statements without entity or requirement link.
    source: internal
