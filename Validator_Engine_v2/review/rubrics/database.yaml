artifact: database
title: Database LLD Architecture Rubric
sources: ["ISO25012", "IEEE1016"]
applicable_tags: ["db-integrity", "isolation", "locking", "caching", "backup"]

dimensions:
  - id: entity_coverage
    label: Entity Coverage, Attributes & Relational Constraints
    weight: 0.30
    description: Domain entities mapped to normalized tables with typed columns, primary keys, and enforced foreign key constraints.
    source: ISO25012

  - id: index_for_queries
    label: Index Strategy for Query Access Patterns
    weight: 0.25
    description: B-Tree/GIN indexes tailored to query filters, joins, sorting, and foreign keys.
    source: IEEE1016

  - id: integrity_and_isolation
    label: Transaction Isolation, Locking & Integrity Guarantees
    weight: 0.25
    description: Declared isolation levels (READ COMMITTED / SERIALIZABLE), row-level locks, and optimistic versioning.
    source: ISO25012

  - id: specificity
    label: Concrete Specificity & Requirement Binding
    weight: 0.20
    description: 5 = named entities, concrete numbers and mechanisms tied to requirement IDs; 0-2 = generic statements without entity or requirement link.
    source: internal
